name: DoWork CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (linting)
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm run test

  backend:
    name: Backend (Flake8 & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python (latest stable 3.x)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 (linting)
        run: flake8

      - name: Run pytest (backend tests)
        env:
          DJANGO_SETTINGS_MODULE: issue_system.settings
        run: pytest

  ci-check:
    name: CI Completion Gate
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Checks Passed
        run: echo "All required frontend and backend CI jobs passed successfully."
